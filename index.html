<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MAL NEWS — Briefing diario</title>
    <meta name="description" content="Briefing diario: internacional, opinión España, noticias España." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#063850" />

    <!-- iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAL NEWS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons: primero el SVG (Chrome y Firefox lo prefieren), el .ico como respaldo -->
    <link rel="icon" href="/mal-news-logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; min-height: 100%; }
      body { background: #E0EBF0; -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker (PWA install prompt depends on this)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => { /* ignore */ });
        });
      }
    </script>
  </body>
</html>
