<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MAL NEWS — Briefing diario</title>
    <meta name="description" content="Tu briefing diario de 47 piezas: mundo, opinión, energía, legal, España." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d5c36" />

    <!-- iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; min-height: 100%; }
      body { background: #0d5c36; -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker (PWA install prompt depends on this)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => { /* ignore */ });
        });
      }
    </script>
